[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minivec"
version = "0.1.0"
description = "An independent educational vector search engine in Python inspired by vector database concepts"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "MiniVec Contributors" }
]
keywords = ["vector-database", "vector-search", "similarity-search", "fastapi", "numpy", "ai-engineering"]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "numpy>=1.26.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/minivec"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
